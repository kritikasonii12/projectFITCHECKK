<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<script>try{var t=localStorage.getItem("fitcheck_theme")||"dark";document.documentElement.setAttribute("data-theme",t);document.querySelector('meta[name=theme-color]').setAttribute("content",t==="light"?"#f6f4fb":"#0b0b12")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<title>Fitcheck — Digital Wardrobe, Wishlist & Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="root"></div>
<div id="modal"></div>
<script src="app.js" defer></script>
</body>
</html>
